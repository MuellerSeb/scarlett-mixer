[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scarlett-mixer"
version = "0.1.0"
description = "NiceGUI-based Scarlett mixer prototype"
requires-python = ">=3.10"
dependencies = [
  "nicegui>=1.4",
]

[tool.setuptools]
py-modules = ["app", "backend", "mixer_ui"]

[project.scripts]
scarlett-mixer = "app:main"
